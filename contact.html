<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>联系方式 | Zovo的作品集</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
      body { cursor: default !important; }
      .custom-cursor { display: none !important; }
    }
    html { scroll-behavior: smooth; }
    body {
      background: #fff;
      color: #111;
      cursor: none;
      opacity: 0;
      transition: opacity 0.8s ease;
      padding: 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    body.loaded { opacity: 1; }
    .custom-cursor {
      position: fixed;
      width: 16px;
      height: 16px;
      background: #111;
      border-radius: 50%;
      z-index: 9999;
      pointer-events: none;
      will-change: transform;
      transform: translate(-50%, -50%);
    }
    .custom-cursor.hover {
      transform: translate(-50%, -50%) scale(1.8);
      background: #000;
      transition: transform 0.15s ease, background 0.2s ease;
    }
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .logo { font-size: 1.2rem; font-weight: 600; }
    .nav-list { display: flex; gap: 3rem; list-style: none; }
    .nav-link { position: relative; text-decoration: none; color: #111; font-size: 1rem; transition: color 0.3s ease; }
    .nav-link:hover, .nav-link.active { color: #000; }
    .nav-link::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 0; height: 1px; background: #000; transition: width 0.3s ease; }
    .nav-link:hover::after, .nav-link.active::after { width: 100%; }
    .page-title { font-size: 3rem; font-weight: 700; margin-bottom: 4rem; }
    .contact-info { font-size: 1.2rem; line-height: 2; margin-bottom: 3rem; color: #333; }
    .animate-on-scroll { opacity: 0; transform: translateY(20px); transition: opacity 0.6s ease, transform 0.6s ease; }
    .animate-on-scroll.visible { opacity: 1; transform: translateY(0); }
    .footer { margin-top: 8rem; font-size: 0.9rem; color: #666; text-align: center; }
    @media (max-width: 768px) {
      .page-title { font-size: 2.2rem; }
      body { padding: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="custom-cursor"></div>
  <nav class="nav animate-on-scroll">
    <div class="logo">Zovo的作品集</div>
    <ul class="nav-list">
      <li><a href="index.html" class="nav-link">首页</a></li>
      <li><a href="about.html" class="nav-link">关于我</a></li>
      <li><a href="contact.html" class="nav-link active">联系方式</a></li>
    </ul>
  </nav>

  <h1 class="page-title animate-on-scroll">联系方式</h1>
  <div class="contact-info animate-on-scroll">
    <p>邮箱：3371540178@qq.com</p>
    <p>微信：T486002079</p>
    <p>手机号：19866142257</p>
    <br>
    <p>欢迎咨询合作、交流创意，我会尽快回复您</p>
  </div>

  <footer class="footer animate-on-scroll">© 2025 Zovo的作品集 | 保留所有权利</footer>

  <script>
    window.addEventListener('DOMContentLoaded',()=>{document.body.classList.add('loaded');if(!document.querySelector('.custom-cursor'))document.body.style.cursor='default';});
    const cursor=document.querySelector('.custom-cursor');document.addEventListener('mousemove',(e)=>{requestAnimationFrame(()=>{cursor.style.left=e.clientX+'px';cursor.style.top=e.clientY+'px';});});
    const interactive=document.querySelectorAll('.nav-link,a');interactive.forEach(el=>{el.addEventListener('mouseenter',()=>cursor.classList.add('hover'));el.addEventListener('mouseleave',()=>cursor.classList.remove('hover'));});
    function isInViewport(el){const rect=el.getBoundingClientRect();return rect.top<=window.innerHeight*0.8&&rect.bottom>=0;}
    function checkScroll(){document.querySelectorAll('.animate-on-scroll').forEach(el=>{if(isInViewport(el)&&!el.classList.contains('visible'))el.classList.add('visible');});}
    window.addEventListener('load',checkScroll);window.addEventListener('scroll',checkScroll);
  </script>
</body>
</html>
